<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusAdsEngine - Secure Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050b14; color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .topnav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(5, 11, 20, 0.95);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            z-index: 10;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #00f3ff, #0066ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #000; box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
        .logo-text { font-size: 20px; font-weight: 700; color: #fff; }
        .nav-links { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .nav-links a { color: #a5b4fc; text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .nav-links a:hover { color: #00f3ff; }
        .join-btn { background: #00f3ff; color: #050b14 !important; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; }

        .main-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 5; padding: 20px; }
        .signin-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h2 { color: #38bdf8; margin-top: 0; text-align: center; font-size: 26px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box;
        }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        button {
            width: 100%; background: linear-gradient(135deg, #0284c7, #38bdf8); color: white; border: none; padding: 13px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; }

        .floating-icons { display: none; }
        @media (min-width: 768px) {
            .floating-icons { position: absolute; width: 100%; height: 100%; pointer-events: none; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 40px; z-index: 1; }
            .topnav { padding: 20px 50px; }
            .signin-card { padding: 40px; }
        }
        .platform-icon {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #00f3ff;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            animation: bounce 3s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <header class="topnav">
        <div class="logo-area">
            <div class="logo-icon">F</div>
            <span class="logo-text">FocusAdsEngine</span>
        </div>
        <nav class="nav-links">
            <a href="/about/">About Us</a>
            <a href="/feedback/">Feedback</a>
            <a href="/terms/">Terms & Conditions</a>
            <a href="/signup/" class="join-btn">Join Us Today</a>
        </nav>
    </header>

    <div class="main-container">
        <div class="signin-card">
            <h2>FocusAdsEngine</h2>
            <p class="subtitle">Sign In to Your Ad Control Panel</p>

            {% if error %}
            <div style="background: rgba(239,68,68,0.2); border:1px solid #ef4444; color:#fca5a5; padding:10px; border-radius:6px; margin-bottom:15px; font-size:13px; text-align:center;">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••••••">
                </div>

                <button type="submit">Sign In</button>
            </form>

            <div class="footer-link">
                Don't have an account? <a href="/signup/">Register here</a>
            </div>
        </div>
    </div>

    <div class="floating-icons">
        <div class="platform-icon">🚀 Meta Ads</div>
        <div class="platform-icon">▶️ YouTube Ads</div>
        <div class="platform-icon">🔍 Google Ads</div>
        <div class="platform-icon">🎵 TikTok Ads</div>
        <div class="platform-icon">📸 Instagram Ads</div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        for (let i = 0; i < 50; i++) {
            particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2, radius: Math.random() * 2 + 1 });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.1)';
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
