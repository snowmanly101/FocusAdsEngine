<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FocusAdsEngine Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; margin-top: 0; }
        .profile-box { background: #e8f0fe; padding: 15px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #1a73e8; }
        .campaign-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 6px; background: #fafafa; }
        button { background: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #1557b0; }
        .status { font-weight: bold; text-transform: uppercase; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FocusAdsEngine Control Panel</h1>
        <p>Welcome to your central ad automation and management dashboard.</p>
        
        <div class="profile-box">
            <h3>Account & Company Profile</h3>
            <p><strong>Account Balance:</strong> <span id="user-balance" style="color: green; font-weight: bold;">Loading...</span></p>
            <p><strong>KYC Verification Status:</strong> <span id="kyc-status" class="status">Loading...</span></p>
        </div>

        <hr>
        <h2>Your Ad Campaigns</h2>
        <div id="campaigns-list">
            <p>Loading campaigns from your backend...</p>
        </div>
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                // Fetch campaigns
                let response = await fetch('/api/campaigns/');
                let campaigns = await response.json();
                let listDiv = document.getElementById('campaigns-list');
                
                // Simulate profile data for display purposes
                document.getElementById('user-balance').innerText = '$0.00';
                document.getElementById('kyc-status').innerText = 'PENDING (Submit ID & Facial Verification)';

                if (campaigns.length === 0) {
                    listDiv.innerHTML = '<p>No campaigns found yet. Create one in the Django Admin panel!</p>';
                    return;
                }

                let html = '';
                campaigns.forEach(c => {
                    html += `
                        <div class="campaign-card">
                            <h3>${c.campaign_name}</h3>
                            <p><strong>Campaign Type:</strong> ${c.campaign_type}</p>
                            <p><strong>Objective:</strong> ${c.objective}</p>
                            <p><strong>Daily Budget:</strong> $${c.daily_budget}</p>
                            <p><strong>Status:</strong> <span class="status">${c.status}</span></p>
                            <button onclick="deployCampaign(${c.id})">Deploy Bot Engine</button>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
            }
        }

        async function deployCampaign(id) {
            if (!confirm("Are you sure you want the bot to deploy this campaign?")) return;
            
            let response = await fetch(`/api/campaigns/${id}/deploy/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                }
            });
            
            let result = await response.json();
            if (response.ok) {
                alert("Success: " + result.message);
                fetchDashboardData();
            } else {
                alert("Error deploying campaign.");
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        fetchDashboardData();
    </script>
</body>
</html>
